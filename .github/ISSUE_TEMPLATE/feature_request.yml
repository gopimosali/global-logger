name: Feature Request
description: Suggest a new feature or enhancement for GlobalLogger
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: I would like to be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered
      placeholder: I've considered using...

  - type: textarea
    id: example
    attributes:
      label: Usage Example
      description: How would you like to use this feature?
      render: php
      placeholder: |
        Log::info('message')->withPriority('high');

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - New Provider
        - Performance
        - Documentation
        - Developer Experience
        - Configuration
        - Testing
        - Other

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: How would this feature benefit users?
      placeholder: This would help users by...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checks
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: This feature would benefit most users, not just my specific use case
          required: true
